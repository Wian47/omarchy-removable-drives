name: Tests

# Model.js is pure parsing and formatting, so the rules that decide "is this
# safe to eject?" can be checked without a compositor. Everything below runs in
# seconds and exists because each failure it catches has actually happened.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # No package.json and no dependencies: the suite loads Model.js as source
      # and evaluates it, so there is nothing to install.
      - name: Run the model tests
        run: node test/model.test.js

      # The README has claimed 75, 116 and 122 tests on days when the suite had
      # a different number. A count in the docs is a promise like any other.
      - name: The README's test count matches the suite
        run: |
          count=$(node test/model.test.js | grep -c '  ok  ')
          claimed=$(grep -oP '# \K[0-9]+(?= tests, no compositor)' README.md)
          if [ "$count" != "$claimed" ]; then
            echo "::error file=README.md::README claims $claimed tests, the suite has $count"
            exit 1
          fi
          echo "$count tests, and the README says so"

      - name: The manifest parses and still declares an id and a version
        run: |
          node -e '
            const m = require("./manifest.json")
            if (!m.id || !m.version) throw new Error("manifest is missing id or version")
            console.log(m.id, m.version)
          '

      # The marketplace capability scan reads the repository as text. A `sudo`
      # or `pacman` string — even inside a sentence saying the plugin does
      # neither — is what held verification at review-required once already,
      # and every one of them was documentation rather than code.
      #
      # .github is excluded because this step's own pattern would match itself.
      - name: No strings that block marketplace verification
        run: |
          if grep -rn -E 'sudo|pkexec|doas|pacman' --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Found a privilege or package-manager string. The marketplace flags these as capabilities and they blocked verification once already; say it without the word."
            exit 1
          fi
          echo "nothing the capability scan would flag"

  qml:
    name: QML syntax and wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install the Qt QML tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools

      # qmlformat rather than qmllint, which was the obvious choice and the
      # wrong one. qmllint resolves types, and every Quickshell and `qs.*` type
      # this plugin uses lives in Omarchy's shell, which is not installed on a
      # runner and never will be — so it reported unqualified access and
      # missing properties on Process and Timer, and exited non-zero for
      # reasons that said nothing about the code. It passes locally only
      # because Quickshell happens to be installed there, which makes it a
      # check that answers a different question on every machine.
      #
      # qmlformat parses the grammar and resolves nothing, so it gives the same
      # answer everywhere: does this file still parse. It says so only through
      # its exit code — a file that fails to parse produces no output at all.
      - name: Panel.qml and Service.qml parse
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          status=0
          for f in Panel.qml Service.qml; do
            if qmlformat "$f" >/dev/null; then
              echo "$f parses"
            else
              echo "::error file=$f::$f is not valid QML — qmlformat could not parse it"
              status=1
            fi
          done
          exit $status

      # The checks that only break when one file disagrees with another: a call
      # to a Model function that was renamed, a panel binding to a service
      # property that is gone, a path reaching a shell unquoted, a scripting
      # verb the README promises and the handler never grew, a setting that
      # exists in two of its three places.
      - name: Files still agree with each other
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          node test/wiring.test.js

      # A check nobody has watched fail is a check nobody knows works. This
      # breaks each invariant in a scratch copy and expects the check to catch it.
      - name: The wiring checks catch what they claim to
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          bash test/prove-wiring.sh
